<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Breach Finder - {{ name }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 40px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="email"],
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .result.show {
            display: block;
            animation: slideIn 0.3s ease-in;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-meta {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .result-meta span {
            display: inline-block;
            margin-right: 20px;
        }

        .result-content {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
        }

        .breach-item {
            padding: 10px;
            background: #fff3cd;
            border-left: 3px solid #ffc107;
            margin: 10px 0;
            border-radius: 4px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c3e6cb;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
            color: #1976d2;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            font-size: 0.9rem;
        }

        .user-badge {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            display: inline-block;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .options {
                grid-template-columns: 1fr;
            }
            
            .input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Email Breach Finder</h1>
            <p>Check if your email has been compromised</p>
            <div class="user-badge">by {{ username }} ({{ name }})</div>
        </div>

        <div class="card">
            <div class="input-group">
                <input type="email" id="emailInput" placeholder="Enter your email address..." required>
                <button onclick="searchEmail()">Search</button>
            </div>

            <div class="options">
                <div class="checkbox-group">
                    <input type="checkbox" id="breaches" checked>
                    <label for="breaches">Include Breaches</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="history">
                    <label for="history">Include History</label>
                </div>
            </div>

            <div class="info-box">
                <strong>ℹ️ API v{{ version }}</strong> - Your search results are secure and confidential.
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px;">Searching...</p>
            </div>

            <div class="result" id="result"></div>
        </div>

        <div class="footer">
            <p>🛡️ Email Breach Finder API - Advanced Security Tool</p>
            <p>Powered by {{ name }} | {{ username }}</p>
        </div>
    </div>

    <script>
        async function searchEmail() {
            const email = document.getElementById('emailInput').value.trim();
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');

            if (!email) {
                result.className = 'result show error';
                result.innerHTML = '<strong>Error:</strong> Please enter an email address.';
                return;
            }

            loading.style.display = 'block';
            result.style.display = 'none';

            try {
                const breaches = document.getElementById('breaches').checked;
                const history = document.getElementById('history').checked;
                
                const response = await fetch(
                    `/api/search?mail=${encodeURIComponent(email)}&breaches=${breaches}&history=${history}`
                );

                const data = await response.json();

                loading.style.display = 'none';

                if (response.ok) {
                    displaySuccess(data);
                } else {
                    displayError(data);
                }
            } catch (error) {
                loading.style.display = 'none';
                result.className = 'result show error';
                result.innerHTML = `<strong>Error:</strong> ${error.message}`;
            }
        }

        function displaySuccess(data) {
            const result = document.getElementById('result');
            const meta = data.meta;
            const searcher = data.searcher;
            const stats = data.statistics;

            let html = `
                <div class="result-meta">
                    <span>📋 Request ID: ${meta.request_id}</span>
                    <span>⏱️ Time: ${meta.response_time_ms}ms</span>
                    <span>🔍 By: ${searcher.username}</span>
                </div>

                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-number">${stats.total_breaches}</div>
                        <div class="stat-label">Breaches Found</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number">${stats.compromised_accounts}</div>
                        <div class="stat-label">Compromised Accounts</div>
                    </div>
                </div>
            `;

            if (stats.total_breaches > 0) {
                html += '<div style="margin-top: 20px;"><strong>⚠️ Breaches Detected:</strong>';
                data.breaches.forEach(breach => {
                    html += `<div class="breach-item">${JSON.stringify(breach)}</div>`;
                });
                html += '</div>';
            } else {
                html += '<div class="info-box" style="margin-top: 20px;">✅ Good news! No breaches found for this email.</div>';
            }

            result.className = 'result show success';
            result.innerHTML = html;
        }

        function displayError(data) {
            const result = document.getElementById('result');
            result.className = 'result show error';
            result.innerHTML = `<strong>Error:</strong> ${data.error} - ${data.message || ''}`;
        }

        // Enter key support
        document.getElementById('emailInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchEmail();
        });
    </script>
</body>
</html>
